<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ismailov AVTOBUS xizmati — qulay va xavfsiz safar</title>
<meta name="description" content="Avtobus va mikroavtobus ijarasi: shaharlararo qatnov, sayohat, to'y va tadbirlar, korxona xodimlarini tashish.">
<meta name="theme-color" content="#0a2a6b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --navy: #0a2a6b;
    --navy-dark: #061a45;
    --blue: #1d5eea;
    --sky: #e8f0ff;
    --accent: #ffb020;
    --text: #172033;
    --muted: #5b667f;
    --white: #ffffff;
    --radius: 18px;
    --shadow: 0 10px 40px -12px rgba(10,42,107,.25);
    --font: 'Inter', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 76px; }
  body { font-family: var(--font); color: var(--text); background: var(--white); line-height: 1.65; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .container { width: min(1140px, 92%); margin-inline: auto; }
  section { padding: 96px 0; }
  .eyebrow { color: var(--blue); font-weight: 700; font-size: .85rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 10px; }
  h2 { font-size: clamp(1.8rem, 4.5vw, 2.7rem); line-height: 1.15; letter-spacing: -.02em; color: var(--navy-dark); margin-bottom: 14px; font-weight: 800; }
  .lead { color: var(--muted); font-size: 1.08rem; max-width: 620px; }
  .center { text-align: center; } .center .lead { margin-inline: auto; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 15px 28px; border-radius: 999px; font-weight: 700; font-size: 1rem; border: 0; cursor: pointer; font-family: var(--font); transition: transform .25s, box-shadow .25s, background .25s; }
  .btn:hover { transform: translateY(-3px); }
  .btn-accent { background: var(--accent); color: #2a1c00; box-shadow: 0 10px 28px -8px rgba(255,176,32,.7); }
  .btn-accent:hover { box-shadow: 0 16px 34px -8px rgba(255,176,32,.9); }
  .btn-outline { border: 2px solid rgba(255,255,255,.5); color: #fff; background: transparent; }
  .btn-outline:hover { background: rgba(255,255,255,.12); border-color: #fff; }
  .btn-blue { background: var(--blue); color: #fff; box-shadow: 0 10px 28px -8px rgba(29,94,234,.7); }

  .reveal { opacity: 0; transform: translateY(34px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.8,.2,1); }
  .reveal.show { opacity: 1; transform: none; }
  .d1 { transition-delay: .1s; } .d2 { transition-delay: .2s; } .d3 { transition-delay: .3s; }

  nav { position: fixed; inset: 0 0 auto 0; z-index: 50; padding: 16px 0; transition: background .3s, box-shadow .3s, padding .3s; }
  nav.scrolled { background: rgba(6,26,69,.94); backdrop-filter: blur(14px); box-shadow: 0 6px 24px rgba(0,0,0,.2); padding: 10px 0; }
  .nav-in { display: flex; justify-content: space-between; align-items: center; }
  .logo { color: #fff; font-weight: 800; font-size: 1.25rem; display: flex; align-items: center; gap: 10px; }
  .logo i { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; font-style: normal; }
  .menu { display: flex; gap: 28px; list-style: none; align-items: center; }
  .menu a { color: rgba(255,255,255,.82); font-weight: 500; font-size: .96rem; transition: color .2s; }
  .menu a:hover { color: #fff; }
  .menu .btn { padding: 10px 20px; font-size: .92rem; color: #2a1c00; }
  .burger { display: none; background: none; border: 0; width: 30px; height: 22px; position: relative; cursor: pointer; z-index: 60; }
  .burger span { position: absolute; left: 0; width: 100%; height: 2.5px; background: #fff; border-radius: 2px; transition: .3s; }
  .burger span:nth-child(1) { top: 0; } .burger span:nth-child(2) { top: 10px; } .burger span:nth-child(3) { top: 20px; }
  .burger.open span:nth-child(1) { top: 10px; transform: rotate(45deg); }
  .burger.open span:nth-child(2) { opacity: 0; }
  .burger.open span:nth-child(3) { top: 10px; transform: rotate(-45deg); }

  #hero { background: radial-gradient(circle at 80% 20%, #1d4fc4 0, transparent 45%), linear-gradient(160deg, var(--navy-dark), var(--navy) 70%); color: #fff; padding: 150px 0 110px; position: relative; overflow: hidden; }
  .hero-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 50px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); padding: 8px 16px; border-radius: 999px; font-size: .88rem; margin-bottom: 22px; }
  .chip b { width: 8px; height: 8px; background: #3ddc97; border-radius: 50%; box-shadow: 0 0 0 0 rgba(61,220,151,.7); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(61,220,151,0); } 100% { box-shadow: 0 0 0 0 rgba(61,220,151,0); } }
  h1 { font-size: clamp(2.3rem, 6vw, 4rem); line-height: 1.08; letter-spacing: -.03em; font-weight: 800; margin-bottom: 20px; }
  h1 span { color: var(--accent); }
  .hero p { color: rgba(255,255,255,.8); font-size: 1.15rem; max-width: 520px; margin-bottom: 32px; }
  .hero-btns { display: flex; flex-wrap: wrap; gap: 14px; }
  .bus-art { width: 100%; filter: drop-shadow(0 30px 40px rgba(0,0,0,.35)); animation: drive 5s ease-in-out infinite; }
  @keyframes drive { 0%,100% { transform: translateX(0); } 50% { transform: translateX(14px); } }
  .road { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.5) 0 40px, transparent 40px 80px); animation: road 1.2s linear infinite; }
  @keyframes road { to { background-position: -80px 0; } }

  .stats { margin-top: -56px; position: relative; z-index: 5; }
  .stats-box { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); display: grid; grid-template-columns: repeat(4, 1fr); padding: 30px 20px; }
  .stat { text-align: center; padding: 6px 10px; border-right: 1px solid #e6ecf7; }
  .stat:last-child { border: 0; }
  .stat b { display: block; font-size: 2.1rem; font-weight: 800; color: var(--blue); line-height: 1.2; }
  .stat span { color: var(--muted); font-size: .92rem; }

  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; margin-top: 50px; }
  .card { background: #fff; border: 1px solid #e3eaf8; border-radius: var(--radius); padding: 30px 26px; transition: transform .35s, box-shadow .35s, border-color .35s; }
  .card:hover { transform: translateY(-8px); box-shadow: var(--shadow); border-color: var(--blue); }
  .card .ico { width: 56px; height: 56px; border-radius: 16px; background: var(--sky); display: grid; place-items: center; font-size: 1.7rem; margin-bottom: 20px; }
  .card h3 { font-size: 1.15rem; margin-bottom: 8px; color: var(--navy-dark); }
  .card p { color: var(--muted); font-size: .96rem; }

  /* YANGILIKLAR BO'LIMI */
  #news { background: #f8fafc; }
  .news-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; margin-top: 40px; }
  .news-card { background: #fff; border: 1px solid #e3eaf8; border-radius: var(--radius); overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,.04); transition: transform .35s, box-shadow .35s; }
  .news-card:hover { transform: translateY(-6px); box-shadow: var(--shadow); }
  .news-content { padding: 24px; }
  .news-date { font-size: .82rem; color: var(--blue); font-weight: 700; margin-bottom: 8px; display: block; text-transform: uppercase; }
  .news-card h3 { font-size: 1.2rem; color: var(--navy-dark); margin-bottom: 10px; line-height: 1.35; }
  .news-card p { color: var(--muted); font-size: .95rem; line-height: 1.5; }

  #fleet { background: var(--sky); }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px; margin-top: 50px; }
  .vehicle { background: #fff; border-radius: 24px; overflow: hidden; box-shadow: var(--shadow); transition: transform .35s; }
  .vehicle:hover { transform: translateY(-8px); }
  .v-top { background: linear-gradient(135deg, var(--navy), var(--blue)); padding: 34px 30px 10px; color: #fff; }
  .v-top h3 { font-size: 1.5rem; }
  .v-top small { opacity: .8; }
  .v-top svg { width: 100%; max-width: 320px; margin: 14px auto -4px; display: block; }
  .v-body { padding: 26px 30px 32px; }
  .v-body ul { list-style: none; display: grid; gap: 11px; margin-bottom: 24px; }
  .v-body li { display: flex; gap: 10px; align-items: flex-start; color: var(--text); }
  .v-body li::before { content: '✓'; color: #fff; background: var(--blue); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; flex-shrink: 0; margin-top: 2px; }
  .price { display: flex; justify-content: space-between; align-items: center; padding-top: 20px; border-top: 1px dashed #cfd9ee; }
  .price span { color: var(--muted); font-size: .9rem; }
  .price b { font-size: 1.1rem; color: var(--navy-dark); }

  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 50px; }
  .why { display: flex; gap: 18px; padding: 26px; border-radius: var(--radius); background: #f6f9ff; transition: .3s; }
  .why:hover { background: var(--sky); transform: translateY(-5px); }
  .why .n { width: 46px; height: 46px; border-radius: 14px; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 800; flex-shrink: 0; }
  .why h3 { font-size: 1.08rem; color: var(--navy-dark); margin-bottom: 4px; }
  .why p { color: var(--muted); font-size: .95rem; }

  #steps { background: linear-gradient(160deg, var(--navy-dark), var(--navy)); color: #fff; }
  #steps h2 { color: #fff; } #steps .lead { color: rgba(255,255,255,.75); } #steps .eyebrow { color: var(--accent); }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; margin-top: 50px; counter-reset: s; }
  .step { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); border-radius: var(--radius); padding: 32px 28px; position: relative; transition: .3s; }
  .step:hover { background: rgba(255,255,255,.12); transform: translateY(-6px); }
  .step::before { counter-increment: s; content: counter(s); font-size: 3.2rem; font-weight: 800; color: var(--accent); opacity: .9; line-height: 1; display: block; margin-bottom: 14px; }
  .step h3 { margin-bottom: 6px; }
  .step p { color: rgba(255,255,255,.75); font-size: .96rem; }

  .contact-grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 50px; margin-top: 50px; align-items: start; }
  .info { display: grid; gap: 16px; }
  .info a, .info div.row { display: flex; align-items: center; gap: 16px; padding: 20px 22px; border-radius: var(--radius); background: #f6f9ff; border: 1px solid #e3eaf8; transition: .3s; }
  .info a:hover { border-color: var(--blue); transform: translateX(6px); box-shadow: var(--shadow); }
  .info .ic { width: 48px; height: 48px; border-radius: 14px; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: 1.3rem; flex-shrink: 0; }
  .info b { display: block; color: var(--navy-dark); }
  .info small { color: var(--muted); }
  .info .phones { display: grid; gap: 4px; }
  .info .phones a { display: block; padding: 0; background: none; border: 0; border-radius: 0; font-weight: 700; color: var(--navy-dark); font-size: 1.05rem; }
  .info .phones a:hover { transform: none; box-shadow: none; border: 0; color: var(--blue); }
  form { background: #fff; border: 1px solid #e3eaf8; box-shadow: var(--shadow); border-radius: 24px; padding: 34px; display: grid; gap: 16px; }
  form h3 { font-size: 1.35rem; color: var(--navy-dark); }
  .f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  label { font-size: .85rem; font-weight: 600; color: var(--navy-dark); display: grid; gap: 6px; }
  input, select, textarea { font-family: var(--font); font-size: 1rem; padding: 13px 15px; border: 1.5px solid #d5def0; border-radius: 12px; background: #fbfcff; outline: none; transition: border-color .2s, box-shadow .2s; width: 100%; }
  input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(29,94,234,.12); }
  textarea { resize: vertical; min-height: 90px; }
  .note { font-size: .82rem; color: var(--muted); text-align: center; }

  /* BAHOLASH BO'LIMI */
  #rating-section { background: #061a45; color: #fff; padding: 60px 0; text-align: center; }
  .rating-box { max-width: 450px; margin: 0 auto; background: rgba(255,255,255,0.06); padding: 30px; border-radius: var(--radius); border: 1px solid rgba(255,255,255,0.12); }
  .rating-box h3 { margin-bottom: 10px; font-size: 1.4rem; color: #fff; }
  .stars { display: flex; justify-content: center; gap: 10px; font-size: 2.2rem; cursor: pointer; margin: 15px 0; }
  .star { color: #5b667f; transition: color .2s; }
  .star.active { color: var(--accent); }
  .rating-text { color: #3ddc97; font-weight: 600; font-size: 0.95rem; margin-top: 10px; display: none; }

  footer { background: var(--navy-dark); color: rgba(255,255,255,.7); padding: 44px 0; text-align: center; }
  footer .logo { justify-content: center; margin-bottom: 12px; }
  footer p { font-size: .9rem; }
